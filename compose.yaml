services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: debt_ledger
      POSTGRES_PASSWORD: debt_ledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debt_ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
